name: Daily Stock Screener

on:
  # Fires at 08:00 IST (= 02:30 UTC) every weekday (Mon–Fri).
  # GitHub Actions cron uses UTC; IST = UTC + 5h30m.
  schedule:
    - cron: "30 2 * * 1-5"

  # Allow a manual trigger from the Actions tab (useful for testing).
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the generated docs/ report back to the repo

jobs:
  run-screener:
    name: Run Sector Rotation Screener
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 4. Run screener ───────────────────────────────────────────────────
      - name: Run screener
        env:
          # Secrets set in: GitHub repo → Settings → Secrets and variables → Actions
          SENDER_EMAIL:         ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD:  ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL:       ${{ secrets.RECEIVER_EMAIL }}
          TRADING_ACCOUNT_SIZE: ${{ secrets.TRADING_ACCOUNT_SIZE || '500000' }}
          RISK_PCT_PER_TRADE:   ${{ secrets.RISK_PCT_PER_TRADE || '1.0' }}
          # e.g. https://<user>.github.io/<repo> — used for the email's report link
          PAGES_BASE_URL:       ${{ secrets.PAGES_BASE_URL }}
        run: python main.py

      # ── 5. Publish the generated report + commit the paper-trade log ──────
      # paper_trades.csv is the ONLY persistent state this project has
      # (see modules/paper_trade_log.py) — each Actions run starts from a
      # fresh checkout, so this file MUST be committed back every run or the
      # 3-month paper-trading log would silently reset to empty daily and
      # check_exits() would never see a prior day's open positions.
      # Runs even if the screener step failed (e.g. email not configured) — the
      # report and paper-trade log are the product; email is just delivery.
      - name: Commit + push docs/ report and paper trade log
        if: success() || failure()
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs
          # Only exists once the first trade has been logged.
          if [ -f paper_trades.csv ]; then git add paper_trades.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish screener report $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes under docs/ or paper_trades.csv — nothing to publish."
          fi

      # ── 6. Upload logs on failure ─────────────────────────────────────────
      - name: Upload log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screener-failure-log
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7
