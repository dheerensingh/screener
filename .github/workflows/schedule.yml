name: Daily Stock Screener

on:
  # Every weekday after the NSE close (15:30 IST). The strategy trades a signal
  # from session T's close at session T+1's open, so the run must see T's final
  # bar and finish before 09:15 IST the next morning; 18:17 IST is after NSE has
  # published that day's delivery bhavcopy and FII/DII figures too.
  #
  # GitHub's scheduler starts jobs hours late (5-8h was observed) and sometimes
  # drops a slot, so there are backups through the night. Whichever runs first
  # processes the session; the others see it's done and exit in seconds.
  # Off-the-hour minutes on purpose: :00 and :30 are GitHub's most congested.
  #   12:47 UTC = 18:17 IST (primary)   16:17 UTC = 21:47 IST
  #   19:47 UTC = 01:17 IST             00:17 UTC = 05:47 IST (Tue-Sat)
  schedule:
    - cron: "47 12 * * 1-5"
    - cron: "17 16 * * 1-5"
    - cron: "47 19 * * 1-5"
    - cron: "17 0 * * 2-6"

  # Manual trigger from the Actions tab. Runs even if the session is already
  # processed, unless "force" is unticked. A run during market hours is safe:
  # the still-forming intraday bar is dropped (stock_fetcher.drop_unsettled_bar).
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the latest session was already processed"
        type: boolean
        default: true

permissions:
  contents: write   # commit the report, dashboard and paper-trading files back to the repo

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run-screener:
    name: Run Sector Rotation Screener
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Always the latest main, never the commit the run was created on: "Re-run"
      # on an old run otherwise checks out that run's commit, i.e. a stale paper
      # account, which then can't be pushed back on top of newer state.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The latest *completed* NSE session, skipping weekends and the NSE
      # holidays cached in docs/data/nse_holidays.json (must match
      # stock_fetcher.latest_completed_session). main.py writes the session its
      # price data actually ended on to docs/data/last_session.txt, so a run
      # whose data came back stale is retried by the next slot.
      - name: Skip if the latest session was already processed
        id: guard
        run: |
          session=$(python3 - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          try:
              holidays = json.load(open("docs/data/nse_holidays.json"))["holidays"]
          except Exception:
              holidays = {}
          trading = lambda d: d.weekday() < 5 and d.isoformat() not in holidays
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          d = now.date()
          if not trading(d) or now.hour < 16:
              d -= timedelta(days=1)
              while not trading(d):
                  d -= timedelta(days=1)
          print(d)
          PY
          )
          echo "session=$session" >> "$GITHUB_OUTPUT"
          echo "Latest completed session: $session"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            exit 0
          fi
          if [ "$(cat docs/data/last_session.txt 2>/dev/null)" = "$session" ]; then
            echo "Session $session already processed — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run screener
        if: steps.guard.outputs.skip != 'true'
        env:
          # Secrets set in: GitHub repo → Settings → Secrets and variables → Actions
          SENDER_EMAIL:         ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD:  ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL:       ${{ secrets.RECEIVER_EMAIL }}
          TRADING_ACCOUNT_SIZE: ${{ secrets.TRADING_ACCOUNT_SIZE || '500000' }}
          RISK_PCT_PER_TRADE:   ${{ secrets.RISK_PCT_PER_TRADE || '1.0' }}
          PAGES_BASE_URL:       ${{ secrets.PAGES_BASE_URL }}
        run: python main.py

      # Runs even if the screener step failed (e.g. email) — the report, dashboard
      # and paper-trading files are the product; email is just delivery.
      # paper_trades.csv / paper_equity.csv are the paper account's ONLY state
      # (see modules/paper_trader.py); every run starts from a fresh checkout, so
      # they must be committed back or the account would reset daily.
      - name: Commit + push report, dashboard and paper account
        if: steps.guard.outputs.skip != 'true' && (success() || failure())
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs
          for f in paper_trades.csv paper_equity.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish screener report $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          else
            echo "Nothing changed — nothing to publish."
          fi

      - name: Upload log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screener-failure-log
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7
