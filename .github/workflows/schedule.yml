name: Daily Stock Screener

on:
  # Weekday evenings, after the NSE close (15:30 IST), on that day's full
  # end-of-day data. GitHub's scheduler routinely starts jobs hours late and
  # sometimes skips a slot, so there are two: the backup exits early if the
  # first already published today's report.
  #   11:30 UTC = 17:00 IST (primary)   15:30 UTC = 21:00 IST (backup)
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 15 * * 1-5"

  # Manual trigger from the Actions tab (always runs).
  workflow_dispatch:

permissions:
  contents: write   # commit the report, dashboard and paper-trading files back to the repo

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run-screener:
    name: Run Sector Rotation Screener
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if today's report already exists
        id: guard
        if: github.event_name == 'schedule'
        run: |
          if [ -f "docs/reports/$(date -u +%Y-%m-%d).html" ]; then
            echo "Today's report is already published — backup run skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run screener
        if: steps.guard.outputs.skip != 'true'
        env:
          # Secrets set in: GitHub repo → Settings → Secrets and variables → Actions
          SENDER_EMAIL:         ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD:  ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL:       ${{ secrets.RECEIVER_EMAIL }}
          TRADING_ACCOUNT_SIZE: ${{ secrets.TRADING_ACCOUNT_SIZE || '500000' }}
          RISK_PCT_PER_TRADE:   ${{ secrets.RISK_PCT_PER_TRADE || '1.0' }}
          PAGES_BASE_URL:       ${{ secrets.PAGES_BASE_URL }}
        run: python main.py

      # Runs even if the screener step failed (e.g. email) — the report, dashboard
      # and paper-trading files are the product; email is just delivery.
      # paper_trades.csv / paper_equity.csv are the paper account's ONLY state
      # (see modules/paper_trader.py); every run starts from a fresh checkout, so
      # they must be committed back or the account would reset daily.
      - name: Commit + push report, dashboard and paper account
        if: steps.guard.outputs.skip != 'true' && (success() || failure())
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs
          for f in paper_trades.csv paper_equity.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish screener report $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          else
            echo "Nothing changed — nothing to publish."
          fi

      - name: Upload log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screener-failure-log
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7
