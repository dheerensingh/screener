name: Yahoo vs NSE Data Audit

# Compares the last year of Yahoo daily bars with NSE's own end-of-day files
# (backtest/audit_data_feed.py). Results are on the run's summary page.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "backtest/audit_data_feed.py"
      - ".github/workflows/data-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m backtest.audit_data_feed --days 365
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-mismatches
          path: audit_mismatches.csv
          if-no-files-found: ignore
